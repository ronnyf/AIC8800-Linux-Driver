name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    outputs:
      version: ${{ steps.version.outputs.version }}
      pkgver: ${{ steps.version.outputs.pkgver }}
    steps:
      - name: Install build tools
        run: |
          pacman -Syu --noconfirm --needed git sudo

      - name: Create builder user
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers

      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          if [[ "$VERSION" == *-* ]]; then
            PKGVER="${VERSION%-*}"
            PKGREL="${VERSION##*-}"
          else
            PKGVER="$VERSION"
            PKGREL="1"
          fi
          {
            echo "tag=${TAG}"
            echo "version=${VERSION}"
            echo "pkgver=${PKGVER}"
            echo "pkgrel=${PKGREL}"
          } >> "$GITHUB_OUTPUT"
          echo "Tag=${TAG} pkgver=${PKGVER} pkgrel=${PKGREL}"

      - name: Stamp version headers from the tag
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BASE="${{ steps.version.outputs.pkgver }}"
          STAMP="$(date -u +%Y_%m%d)_$(echo "${GITHUB_SHA}" | cut -c1-8)"
          for d in aic_load_fw aic8800_fdrv; do
            printf '%s\n' \
              "/* Generated by the release workflow from tag v${VERSION}. Do not edit. */" \
              "#define RWNX_VERS_REV \"${VERSION} (fork: ${GITHUB_REPOSITORY})\"" \
              "#define RWNX_VERS_MOD \"${BASE}\"" \
              "#define RWNX_VERS_BANNER \"rwnx v${VERSION} (fork: ${GITHUB_REPOSITORY})\"" \
              "#define RELEASE_DATE \"${STAMP}\"" \
              > "drivers/aic8800/${d}/rwnx_version_gen.h"
          done
          cat drivers/aic8800/aic8800_fdrv/rwnx_version_gen.h

      - name: Create source tarball
        id: tarball
        run: |
          PKGVER="${{ steps.version.outputs.pkgver }}"
          PKGREL="${{ steps.version.outputs.pkgrel }}"
          PKGDIR="AIC8800-Linux-Driver-${PKGVER}-${PKGREL}"
          TARBALL="${PKGDIR}.tar.gz"

          mkdir -p "_stage/${PKGDIR}/drivers/aic8800"
          mkdir -p "_stage/${PKGDIR}/fw"
          mkdir -p "_stage/${PKGDIR}/tools"

          cp -r drivers/aic8800/aic_load_fw  "_stage/${PKGDIR}/drivers/aic8800/"
          cp -r drivers/aic8800/aic8800_fdrv "_stage/${PKGDIR}/drivers/aic8800/"
          cp    drivers/aic8800/Makefile     "_stage/${PKGDIR}/drivers/aic8800/"
          cp    drivers/aic8800/Kconfig      "_stage/${PKGDIR}/drivers/aic8800/"
          cp -r fw/aic8800D80                "_stage/${PKGDIR}/fw/"
          cp    tools/aic.rules              "_stage/${PKGDIR}/tools/"
          cp    dkms.conf                    "_stage/${PKGDIR}/"
          cp    LICENSE                      "_stage/${PKGDIR}/"
          cp    README.md                    "_stage/${PKGDIR}/"

          # --exclude guards against build residue if staged from a dirty tree;
          # CI's checkout is clean, a local run may not be.
          tar --exclude='*.o' --exclude='*.ko' --exclude='*.mod' \
              --exclude='*.cmd' --exclude='*.symvers' --exclude='modules.order' \
              -czf "${TARBALL}" -C _stage "${PKGDIR}"
          rm -rf _stage

          echo "tarball=${TARBALL}" >> "$GITHUB_OUTPUT"
          ls -lh "${TARBALL}"

      - name: Patch PKGBUILD with tag version
        run: |
          sed -i "s/^pkgver=.*/pkgver=${{ steps.version.outputs.pkgver }}/" PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=${{ steps.version.outputs.pkgrel }}/" PKGBUILD
          grep -E '^(pkgname|pkgver|pkgrel)=' PKGBUILD

      - name: Build pacman package
        id: pacman
        run: |
          chown -R builder:builder .
          sudo -u builder makepkg --noconfirm --skipchecksums --nodeps -f
          PKGFILE=$(ls aic8800-fdrv-dkms-*.pkg.tar.zst | head -1)
          [ -n "$PKGFILE" ] || { echo "ERROR: no .pkg.tar.zst produced"; exit 1; }
          echo "pkg=${PKGFILE}" >> "$GITHUB_OUTPUT"
          ls -lh "${PKGFILE}"
          echo "--- package contents ---"
          bsdtar -tf "${PKGFILE}" | head -40

      - name: Generate .SRCINFO
        run: |
          sudo -u builder makepkg --printsrcinfo > .SRCINFO
          cat .SRCINFO

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Release ${{ steps.version.outputs.version }}"
          generate_release_notes: true
          body: |
            ## Install on Arch Linux / CachyOS

            **Option 1 — install the prebuilt package:**
            ```bash
            curl -LO https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/${{ steps.pacman.outputs.pkg }}
            sudo pacman -U ${{ steps.pacman.outputs.pkg }}
            ```

            **Option 2 — build from PKGBUILD with `makepkg`:**
            ```bash
            curl -LO https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/PKGBUILD
            curl -LO https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/aic8800-fdrv-dkms.install
            makepkg -si
            ```

            DKMS rebuilds the modules automatically on each kernel update.
            Make sure the matching headers are installed for your kernel
            (`linux-headers`, `linux-cachyos-headers`, etc.).
          files: |
            ${{ steps.tarball.outputs.tarball }}
            ${{ steps.pacman.outputs.pkg }}
            PKGBUILD
            .SRCINFO
            aic8800-fdrv-dkms.install

  # Builds the .deb from the release tarball the Arch job already published, so
  # both packages ship byte-identical source. needs: release is a real data
  # dependency, not just notes ordering.
  deb:
    name: Build Debian package
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Download the release source tarball
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ github.ref_name }}" -R "${GITHUB_REPOSITORY}" \
            -p 'AIC8800-Linux-Driver-*.tar.gz'
          ls -lh ./*.tar.gz

      - name: Build .deb
        id: deb
        run: |
          set -eu
          VERSION="${{ needs.release.outputs.version }}"
          BASE="${{ needs.release.outputs.pkgver }}"
          PKG=aic8800-fdrv-dkms
          DEB="${PKG}_${VERSION}_all.deb"

          tar -xzf AIC8800-Linux-Driver-*.tar.gz
          SRC=$(find . -maxdepth 1 -type d -name 'AIC8800-Linux-Driver-*' | head -1)
          [ -n "$SRC" ] || { echo "ERROR: tarball did not unpack"; exit 1; }

          R=_deb
          DEST="$R/usr/src/${PKG}-${BASE}"
          mkdir -p "$DEST" "$R/DEBIAN" "$R/lib/firmware/aic8800D80" "$R/etc/udev/rules.d"

          cp -r "$SRC/drivers/aic8800/aic_load_fw" "$SRC/drivers/aic8800/aic8800_fdrv" "$DEST/"
          cp "$SRC/drivers/aic8800/Makefile" "$SRC/drivers/aic8800/Kconfig" "$DEST/"
          sed "s/^PACKAGE_VERSION=.*/PACKAGE_VERSION=\"${BASE}\"/" "$SRC/dkms.conf" > "$DEST/dkms.conf"
          cp "$SRC"/fw/aic8800D80/* "$R/lib/firmware/aic8800D80/"
          cp "$SRC/tools/aic.rules" "$R/etc/udev/rules.d/aic.rules"

          printf '%s\n' \
            "Package: ${PKG}" \
            "Version: ${VERSION}" \
            "Architecture: all" \
            "Maintainer: Ronny F. <ronnyf@icloud.com>" \
            "Section: kernel" \
            "Priority: optional" \
            "Depends: dkms" \
            "Recommends: eject, linux-headers-generic" \
            "Homepage: https://github.com/${GITHUB_REPOSITORY}" \
            "Installed-Size: $(du -sk "$R" | cut -f1)" \
            "Description: AIC8800 (D80/DC/DW) USB WiFi driver - DKMS source package" \
            " Builds the aic_load_fw and aic8800_fdrv kernel modules via DKMS," \
            " rebuilding automatically on each kernel update." \
            > "$R/DEBIAN/control"

          printf '%s\n' \
            '#!/bin/sh' 'set -e' \
            "N=${PKG}" "V=${BASE}" \
            'case "$1" in' \
            '  configure)' \
            '    dkms add -m "$N" -v "$V" 2>/dev/null || true' \
            '    dkms install -m "$N" -v "$V" --force' \
            '    ;;' \
            'esac' \
            > "$R/DEBIAN/postinst"

          printf '%s\n' \
            '#!/bin/sh' 'set -e' \
            "N=${PKG}" "V=${BASE}" \
            'case "$1" in' \
            '  remove|upgrade|deconfigure)' \
            '    dkms remove -m "$N" -v "$V" --all 2>/dev/null || true' \
            '    ;;' \
            'esac' \
            > "$R/DEBIAN/prerm"

          chmod 755 "$R/DEBIAN/postinst" "$R/DEBIAN/prerm"
          dpkg-deb --build --root-owner-group "$R" "$DEB"

          echo "deb=${DEB}" >> "$GITHUB_OUTPUT"
          dpkg-deb -I "$DEB"
          dpkg-deb -c "$DEB" | head -20

      - name: Append the .deb to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          append_body: true
          body: |

            ## Install on Debian / Ubuntu

            ```bash
            curl -LO https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/${{ steps.deb.outputs.deb }}
            sudo apt install dkms "linux-headers-$(uname -r)"
            sudo dpkg -i ${{ steps.deb.outputs.deb }}
            ```

            If the kernel headers are installed afterwards, run `sudo dkms autoinstall`.
          files: ${{ steps.deb.outputs.deb }}

  # Runs only after the release exists, since the repository is built from
  # release assets. Using needs: rather than a workflow_run trigger keeps the
  # ordering explicit instead of racing release creation.
  publish-repo:
    name: Publish pacman repository
    needs: release
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pacman-repo.yml
